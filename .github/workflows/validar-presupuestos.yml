name: Validar Presupuestos PDF

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/presupuestos-pdf-sii-20261116]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Pruebas y compilación
        run: npm run build
